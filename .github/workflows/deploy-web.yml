name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: pages
        uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      # The anon key is public by design (row level security protects the data); it is read from
      # the project here so it never has to be pasted anywhere.
      - name: Supabase URL and anon key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          key="$(pnpm exec supabase projects api-keys --project-ref "$PROJECT_REF" -o json \
            | jq -r 'map(select(.name == "anon" or .type == "publishable")) | first | .api_key')"
          [ -n "$key" ] && [ "$key" != null ] || { echo "No anon key found"; exit 1; }
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$PROJECT_REF.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"

      # The site is served from /<repo>, so every asset and link needs that prefix.
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
