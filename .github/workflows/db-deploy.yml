name: Deploy database and engine

# Applies new migrations and deploys the engine Edge Function to the hosted Supabase project.
# Needs repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ["supabase/**", "packages/domain/**"]
  workflow_dispatch:

concurrency:
  group: db-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        run: pnpm exec supabase db push --include-all

      - name: Deploy the engine function
        run: pnpm exec supabase functions deploy engine --project-ref "$PROJECT_REF" --use-api
